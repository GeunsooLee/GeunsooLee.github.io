<h1>Dominify</h1>
<p class="date">DGSTUDIO</p>
<p>盤面是一幅圖畫,將相鄰的兩個格子連起來放上骨牌、完成圖畫的骨牌圖畫拼圖。可以挑戰 10 個階段的內建圖案,也能用自己的照片製作骨牌拼圖。照片只會在裝置上轉換成盤面,不會上傳到任何地方。</p>
